name: test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SIMDONNX_REQUIRE_CONFORMANCE: '1'

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: win-x64,     os: windows-2025 }
          - { name: win-arm64,   os: windows-11-arm }
          - { name: osx-arm64,   os: macos-26 }
    steps:
      - uses: actions/checkout@v5
        with: { path: Sdcb.SimdOnnx }
      # test fixtures and models live in the consumer repos, checked out next to this one
      - uses: actions/checkout@v5
        with: { repository: sdcb/Sdcb.GcdrNet, path: Sdcb.GcdrNet }
      - uses: actions/checkout@v5
        with: { repository: sdcb/SimdPaddleOCR, path: SimdPaddleOCR }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      # ONNX backend node tests (onnx/onnx v1.22.0, Apache-2.0), checked by SHA-256 in the script
      - uses: actions/cache@v4
        with:
          path: Sdcb.SimdOnnx/artifacts/cache/onnx-node-v1.22.0
          key: onnx-node-v1.22.0
      - name: Fetch ONNX node tests
        working-directory: Sdcb.SimdOnnx
        shell: pwsh
        run: ./tools/fetch-onnx-tests.ps1
      - name: Test (net10.0)
        working-directory: Sdcb.SimdOnnx
        run: dotnet test tests/Sdcb.SimdOnnx.Tests -c Release -f net10.0 --nologo --logger "console;verbosity=normal"
      - name: Public API (no InternalsVisibleTo)
        working-directory: Sdcb.SimdOnnx
        run: dotnet test tests/Sdcb.SimdOnnx.PublicApiTests -c Release --nologo
      - name: Test (net48 host, netstandard2.0 engine)
        if: runner.os == 'Windows'
        working-directory: Sdcb.SimdOnnx
        run: dotnet test tests/Sdcb.SimdOnnx.Tests -c Release -f net48 --nologo

  isa-x64:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        isa:
          - DOTNET_EnableAVX512=0
          - DOTNET_EnableAVX2=0
          - DOTNET_EnableHWIntrinsic=0
    steps:
      - uses: actions/checkout@v5
        with: { path: Sdcb.SimdOnnx }
      - uses: actions/checkout@v5
        with: { repository: sdcb/Sdcb.GcdrNet, path: Sdcb.GcdrNet }
      - uses: actions/checkout@v5
        with: { repository: sdcb/SimdPaddleOCR, path: SimdPaddleOCR }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      # ONNX backend node tests (onnx/onnx v1.22.0, Apache-2.0), checked by SHA-256 in the script
      - uses: actions/cache@v4
        with:
          path: Sdcb.SimdOnnx/artifacts/cache/onnx-node-v1.22.0
          key: onnx-node-v1.22.0
      - name: Fetch ONNX node tests
        working-directory: Sdcb.SimdOnnx
        shell: pwsh
        run: ./tools/fetch-onnx-tests.ps1
      - name: Test (${{ matrix.isa }})
        working-directory: Sdcb.SimdOnnx
        shell: pwsh
        run: |
          $k, $v = '${{ matrix.isa }}'.Split('=')
          [Environment]::SetEnvironmentVariable($k, $v)
          dotnet test tests/Sdcb.SimdOnnx.Tests -c Release -f net10.0 --nologo
